<!DOCTYPE html>
<html>
  <head>
    <style type="text/css">
      @font-face {
        font-family: "MyCustomFont"; /* Choose a name for your font */
        src: url("woff/3270NerdFontMono-Regular.woff2") format("woff2"); /* Path to your WOFF2 file */
        font-weight: normal; /* Define the weight (e.g., normal, bold, 400, 700) */
        font-style: normal; /* Define the style (e.g., normal, italic) */
        /* Optional: Add other formats for broader browser support */
      }
      body  {
        position:absolute;
        top:0;
        left:0;
        right:0;
        margin: 0;
      }
      div.header {
        position:relative;
        height:211px;
        width: 100%;
        background-image: url(SFSHeader.png);
        background-size: auto 211px;
        background-position: top left;
      }
      div.col {
        width:45%;
        min-width:250px;
        display: inline-block;
        text-align: center;
      }
    </style>
    <!-- QR CODE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div class="header">
      
    </div>
    <h1><b>Freshwate<span style="color:blue;">R</span></b></h1>
    <div class="col col1">
      <div class="colhead">
        <h2>Unit 1: Google Colab</h2>
      </div>
      <div class="colbody">
        <a href="https://colab.research.google.com/#create=true&language=r">Link Directly to Colab R</a>
        <script type="text/javascript">
          new QRCode(document.getElementById("qrcode"), "https://colab.research.google.com/#create=true&language=r");
        </script>
      </div> <!-- end colbody -->
    </div> <!-- end col1 -->
    <div class="col col2">
      <h2>Unit 2: RStudio</h2>
      <h3>Step 1: Install R</h3>
      <a href="boom">Download R</a>
      <script>
          new QRCode(document.getElementById("qrcode"), "boom");
      </script>
      <br>
      <h3>Step 2: Install RStudio</h3>
      <a href="boom">Download R</a>
      <script>
          new QRCode(document.getElementById("qrcode"), "boom");
      </script>
      
    </div> <!-- end col2 -->      
  </body>
</html>
